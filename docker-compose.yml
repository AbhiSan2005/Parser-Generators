services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfa-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://Karan_30:HLJkZWFCF3OtQoko@toccluster.oekk5lu.mongodb.net/TocProjectDB}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    networks:
      - dfa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: dfa-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - dfa-network

networks:
  dfa-network:
    driver: bridge
